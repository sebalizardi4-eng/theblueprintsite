<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy blueprint background -->
  <rect width="32" height="32" rx="5" fill="#07111d"/>

  <!-- Blueprint grid lines -->
  <line x1="0" y1="16" x2="32" y2="16" stroke="#c9a452" stroke-width="0.3" opacity="0.09"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="#c9a452" stroke-width="0.3" opacity="0.09"/>

  <!-- Circle frame (mirrors the logo mark) -->
  <circle cx="16" cy="15" r="13" fill="none" stroke="#c9a452" stroke-width="0.65" opacity="0.35"/>

  <!-- Martini glass bowl — V triangle -->
  <path d="M6 8 L26 8 L16 21 Z"
    fill="rgba(201,164,82,0.07)"
    stroke="#c9a452"
    stroke-width="1.4"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="16" y1="21" x2="16" y2="26"
    stroke="#c9a452" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="11.5" y1="26" x2="20.5" y2="26"
    stroke="#c9a452" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Cocktail pick / toothpick -->
  <line x1="14" y1="18.5" x2="21" y2="11"
    stroke="#c9a452" stroke-width="0.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Olive -->
  <circle cx="21.5" cy="10.5" r="1.7"
    fill="none" stroke="#c9a452" stroke-width="0.9"/>
  <circle cx="21.5" cy="10.5" r="1"
    fill="#c9a452" opacity="0.35"/>

  <!-- Blueprint measurement tick marks at glass rim corners -->
  <line x1="6" y1="6" x2="6" y2="8"
    stroke="#c9a452" stroke-width="0.55" opacity="0.45"/>
  <line x1="26" y1="6" x2="26" y2="8"
    stroke="#c9a452" stroke-width="0.55" opacity="0.45"/>
  <line x1="4" y1="7" x2="6" y2="7"
    stroke="#c9a452" stroke-width="0.55" opacity="0.45"/>
  <line x1="26" y1="7" x2="28" y2="7"
    stroke="#c9a452" stroke-width="0.55" opacity="0.45"/>
</svg>
